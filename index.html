<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EffectEmu Previews</title>
<style>
:root{color-scheme:dark}body{font-family:system-ui,sans-serif;margin:0;background:#0b0d10;color:#e7e9ee}main{max-width:980px;margin:0 auto;padding:48px 24px}h1{font-size:clamp(2rem,6vw,4rem);margin:0 0 12px}.muted{color:#9ca3af}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:32px}.card{display:block;padding:20px;border:1px solid #29303a;border-radius:14px;background:#12161c;color:inherit;text-decoration:none}.card:hover{border-color:#596273}code{font-family:ui-monospace,monospace}</style>
</head>
<body>
<main>
<h1>EffectEmu Previews</h1>
<p class="muted">Visualizador público de efeitos experimentais.</p>
<div id="effects" class="grid"></div>
<p id="empty" class="muted">Nenhuma prévia publicada ainda.</p>
</main>
<script>
(async()=>{try{const r=await fetch('./manifest.json',{cache:'no-store'});if(!r.ok)return;const data=await r.json();const root=document.getElementById('effects');for(const item of data.effects||[]){const a=document.createElement('a');a.className='card';a.href=item.path;a.innerHTML='<strong>'+String(item.title||item.id).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</strong><br><span class="muted">'+String(item.status||'preview')+'</span>';root.appendChild(a)}if((data.effects||[]).length)document.getElementById('empty').hidden=true}catch{}})();
</script>
</body></html>
